pre-commit:
  jobs:
    - name: prettier
      glob: "*.{js,mjs,cjs,ts,tsx,json,jsonc,md,yml,yaml,css,html}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: eslint
      glob: "*.{js,mjs,cjs,ts,tsx}"
      run: pnpm exec eslint --max-warnings=0 {staged_files}
    - name: forbidden-terms
      run: node scripts/check-forbidden-terms.mjs
    # Secret scan of the staged changes with the repo's .gitleaks.toml. Optional
    # locally (CI scans the full history either way), so it never blocks a
    # contributor who has not installed gitleaks. No double quotes in the script:
    # on Windows lefthook runs `"<sh>" -c "<script>"` without escaping them.
    - name: gitleaks
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --staged --redact --no-banner --verbose .
        else
          echo 'gitleaks is not installed: skipping the local secret scan (CI still runs it).'
        fi

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
    - name: forbidden-terms
      run: node scripts/check-forbidden-terms.mjs --msg {1}
