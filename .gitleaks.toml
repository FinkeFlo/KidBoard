# gitleaks configuration (read from the repo root by `gitleaks git .` in CI and by the
# lefthook pre-commit job). Keeps all built-in rules and adds KidBoard's main secret.
title = "KidBoard gitleaks configuration"

[extend]
useDefault = true

# The secret iCal address of a Google calendar: whoever has it can read the calendar.
# Case-insensitive; current and legacy host; any scheme (https, webcal); slashes may be
# JSON-escaped (`\/`). Template placeholders (e.g. in `.dev.vars.example`) are not hex
# and do not match. The keyword is a prefilter, so it must occur in every one of these
# shapes; gitleaks matches keywords case-insensitively (the built-in private-key rule
# relies on that with the keyword "-----begin").
[[rules]]
id = "google-calendar-secret-ical-url"
description = "Google Calendar secret iCal address"
regex = '''(?i)(?:calendar|www)\.google\.com\\?/calendar\\?/ical\\?/[^/\\\s"']+\\?/private-[0-9a-f]{16,}\\?/'''
keywords = ["google.com"]
tags = ["calendar", "url"]
