name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs only need to read the repository.
permissions:
  contents: read

# Cancel superseded runs of the same branch / pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No telemetry from wrangler (worker build runs `wrangler deploy --dry-run`).
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from the `packageManager` field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Also runs `wrangler deploy --dry-run --outdir dist` for the worker.
      - name: Build
        run: pnpm build

      # The deploy itself, minus the upload: same root wrangler.jsonc and command as
      # `pnpm deploy:cloudflare` and the Git/"Deploy to Cloudflare" builds (docs/DEPLOY.md).
      # Validates the config, bundles the worker and reads dist/_headers; needs no account.
      - name: Cloudflare deploy dry run
        run: pnpm exec wrangler deploy --dry-run

      # Headless runs only need the Chromium headless shell (smaller download).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # Serves the built apps/web/dist via `vite preview`, so it must run after the build.
      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # README screenshots (T-24): generated from the built app with synthetic demo data and
  # uploaded as an artifact. Not part of the e2e run, so nothing is rewritten there.
  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The screenshot run serves the built apps/web/dist (`vite preview`).
      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Generate screenshots
        run: pnpm screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz from the release's checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The MIT-licensed gitleaks CLI is used directly (pinned + checksum-verified)
      # instead of gitleaks-action, whose non-OSI license needs a key for org-owned repos.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      # `gitleaks git` scans every commit (`git log -p --all --full-history`).
      - name: Scan full git history
        run: |
          "${RUNNER_TEMP}/gitleaks" git . \
            --redact --no-banner --verbose --exit-code 1
