name: release-please

# Manual until the maintainer cuts the first release (T-28); switch back to
# `push: branches: [main]` afterwards so release PRs are kept up to date.
on:
  workflow_dispatch:

# Default for all jobs: no token permissions; the job below opts in.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create tags, GitHub releases, CHANGELOG.md commits
      pull-requests: write # open / update the release PR
    steps:
      # Reads release-please-config.json + .release-please-manifest.json (defaults).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
